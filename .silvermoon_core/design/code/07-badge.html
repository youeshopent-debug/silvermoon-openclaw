<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'] },
          colors: {
            'bg-deep': '#0A0A0F',
            'accent': '#00D4FF',
            'accent-subtle': 'rgba(0,212,255,0.12)'
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0F; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 200px; -webkit-font-smoothing: antialiased; }
    .container { display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .row { display: flex; gap: 8px; align-items: center; }
    .badge-accent {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 9999px;
      color: #00D4FF;
      background: rgba(0,212,255,0.12);
    }
    .badge-neutral {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 9999px;
      color: rgba(255,255,255,0.65);
      background: rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <span class="badge-accent">NEW</span>
      <span class="badge-accent">ACTIVE</span>
      <span class="badge-accent">BETA</span>
    </div>
    <div class="row">
      <span class="badge-neutral">INFO</span>
      <span class="badge-neutral">PENDING</span>
      <span class="badge-neutral">DRAFT</span>
    </div>
  </div>
</body>
</html>
