<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'] },
          colors: {
            'bg-deep': '#0A0A0F',
            'bg-elevated': '#1A1A26',
            'accent': '#00D4FF',
            'text-primary': '#F1F1F7',
            'text-secondary': 'rgba(255,255,255,0.65)'
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0F; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 300px; -webkit-font-smoothing: antialiased; }
    .container { display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .field { display: flex; flex-direction: column; gap: 4px; width: 320px; }
    .field label { font-size: 12px; font-weight: 500; }
    .input-group { display: flex; justify-content: space-between; }
    .input-group span { font-size: 11px; }
    input {
      width: 100%;
      height: 40px;
      border-radius: 6px;
      padding: 0 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #F1F1F7;
      background: #1A1A26;
      outline: none;
      transition: all 0.2s ease;
    }
    input::placeholder { color: rgba(255,255,255,0.40); }
    .input-default { border: 1px solid rgba(255,255,255,0.10); }
    .input-focus { border: 1px solid #00D4FF; box-shadow: 0 0 0 3px rgba(0,212,255,0.12); }
    .input-error { border: 1px solid #EF4444; }
    .input-success { border: 1px solid #22C55E; }
  </style>
</head>
<body>
  <div class="container">
    <div class="field">
      <label style="color:rgba(255,255,255,0.65);">Default</label>
      <input class="input-default" placeholder="Enter text..." />
    </div>
    <div class="field">
      <label style="color:rgba(255,255,255,0.65);">Focus</label>
      <input class="input-focus" placeholder="Enter text..." />
    </div>
    <div class="field">
      <div class="input-group">
        <label style="color:#EF4444;">Error</label>
        <span style="color:#EF4444;">Invalid email</span>
      </div>
      <input class="input-error" placeholder="Enter email..." value="invalid@" />
    </div>
    <div class="field">
      <div class="input-group">
        <label style="color:#22C55E;">Success</label>
        <span style="color:#22C55E;">Verified</span>
      </div>
      <input class="input-success" placeholder="Enter email..." value="user@example.com" />
    </div>
  </div>
</body>
</html>
