<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云门阁·宗门五界修仙图卷</title>
    <style>
        * {
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            font-family: 'Courier New', Courier, "Microsoft YaHei", monospace;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #110b07;
            color: #e5d3b3;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .control-panel {
            width: 240px;
            height: 100%;
            background-color: #1c130c;
            border-right: 4px solid #2d1f14;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset -4px 0 0 #120a05;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 2px dashed #4a3321;
            padding-bottom: 10px;
        }

        .template-btn {
            background-color: #2d1f14;
            border: 3px solid #4a3321;
            color: #b3a285;
            padding: 12px;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-shadow: inset 2px 2px 0 #3d2a1b;
        }

        .template-btn:hover {
            background-color: #3d2a1b;
            color: #ffd700;
        }

        .template-btn.active {
            background-color: #8c2d19;
            border-color: #ff6347;
            color: #ffffff;
            box-shadow: inset 3px 3px 0 #b83b20;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f0a06;
            position: relative;
        }

        .game-canvas {
            width: 960px;
            height: 640px;
            position: relative;
            background-image:
                linear-gradient(to right, #16100c 2px, transparent 2px),
                linear-gradient(to bottom, #16100c 2px, transparent 2px);
            background-size: 32px 32px;
            background-color: #231a14;
            border: 6px solid #1c110a;
            box-shadow: inset 6px 6px 0 #3d2719, inset -6px -6px 0 #120a05, 0 12px 24px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .top-ui-scroll {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 40px;
            background-color: #dfceb1;
            border: 3px solid #2b261f;
            box-shadow: inset 3px 3px 0 #f5e7ce, inset -3px -3px 0 #b3a285, 0 4px 8px rgba(0,0,0,0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 16px;
            color: #2b261f;
            font-size: 12px;
            font-weight: bold;
        }

        .pixel-avatar {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
        }

        .sprite-shadow {
            width: 28px;
            height: 7px;
            background: rgba(0,0,0,0.45);
            border-radius: 50%;
            margin-top: -2px;
            flex-shrink: 0;
        }

        .sprite-image {
            width: 48px;
            height: 48px;
            background-repeat: no-repeat;
            background-size: 192px 96px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            flex-shrink: 0;
        }

        .name-tag {
            background: #ffe359;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border: 2px solid #000;
            white-space: nowrap;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
            margin-bottom: 2px;
        }

        .speech-bubble {
            position: absolute;
            top: -75px;
            left: 35px;
            width: 180px;
            background: #ffffff;
            border: 3px solid #000;
            color: #000;
            padding: 6px;
            font-size: 11px;
            z-index: 90;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }

        .scene-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: none;
        }

        .scene-layer.active {
            display: block;
        }

        .pixel-cauldron {
            position: absolute;
            width: 64px;
            height: 72px;
            background: #3a3a3a;
            box-shadow:
                inset 8px 8px 0 #5a5a5a,
                inset -8px -8px 0 #1e1e1e,
                0 8px 0 #ff4500,
                0 -8px 0 #47a0ff;
            border: 4px solid #000;
        }

        .floating-sword {
            position: absolute;
            width: 8px;
            height: 48px;
            background: #e0f0ff;
            box-shadow: 0 0 12px #47a0ff, inset 2px 0 0 #ffffff;
            border: 2px solid #2b558c;
            animation: floatAnim 2s ease-in-out infinite alternate;
        }

        .bagua-array {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 6px double #3d7e5a;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(28,61,45,0.6) 0%, transparent 70%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bagua-core {
            width: 80px;
            height: 80px;
            background: linear-gradient(to right, #fff 50%, #000 50%);
            border-radius: 50%;
            animation: spin 12s linear infinite;
        }

        .stone-monolith {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 380px;
            height: 120px;
            background: #3a3f41;
            border: 4px solid #1e2122;
            box-shadow: inset 4px 4px 0 #575e62, inset -4px -4px 0 #252829;
            padding: 12px;
            font-size: 12px;
            color: #d1d5db;
        }

        .walking-zhangtie {
            animation: walkCycle 1.6s steps(4) infinite;
        }
        @keyframes walkCycle {
            0%   { left: 240px; top: 240px; }
            25%  { left: 280px; top: 230px; }
            50%  { left: 320px; top: 240px; }
            75%  { left: 280px; top: 250px; }
            100% { left: 240px; top: 240px; }
        }

        .glowing-chest {
            position: absolute;
            width: 40px;
            height: 32px;
            border: 3px solid #000;
            animation: chestGlow 1.5s ease-in-out infinite alternate;
            perspective: 200px;
        }
        .chest-lid {
            width: 34px;
            height: 10px;
            border: 2px solid #000;
            position: absolute;
            top: -8px;
            left: 0;
            transform-origin: bottom center;
            animation: lidOpen 2s ease-in-out infinite alternate;
        }
        .chest-lock {
            width: 6px;
            height: 6px;
            background: #ffd700;
            border: 2px solid #000;
            position: absolute;
            top: 4px;
            left: 50%;
            margin-left: -3px;
            box-shadow: 0 0 8px #ffd700;
        }

        .chest-common {
            background: #6e4528;
            box-shadow:
                inset 3px 3px 0 #8c6847,
                inset -3px -3px 0 #3a2514,
                0 0 12px rgba(255, 215, 0, 0.3);
        }
        .chest-common .chest-lid {
            background: #5c3a1e;
            box-shadow:
                inset 2px 2px 0 #8c6847,
                inset -2px -2px 0 #3a2514;
        }

        .chest-rare {
            background: #2b558c;
            box-shadow:
                inset 3px 3px 0 #4a7ebb,
                inset -3px -3px 0 #1a3563,
                0 0 18px rgba(71, 160, 255, 0.5);
        }
        .chest-rare .chest-lid {
            background: #1a3563;
            box-shadow:
                inset 2px 2px 0 #4a7ebb,
                inset -2px -2px 0 #0d1f3d;
        }
        .chest-rare .chest-lock {
            background: #47a0ff;
            box-shadow: 0 0 12px #47a0ff;
        }

        .chest-epic {
            background: #4a1a5c;
            box-shadow:
                inset 3px 3px 0 #7a2b8c,
                inset -3px -3px 0 #2a0e3a,
                0 0 24px rgba(163, 53, 238, 0.6);
        }
        .chest-epic .chest-lid {
            background: #2a0e3a;
            box-shadow:
                inset 2px 2px 0 #7a2b8c,
                inset -2px -2px 0 #16071f;
        }
        .chest-epic .chest-lock {
            background: #a335ee;
            box-shadow: 0 0 16px #a335ee;
        }

        .chest-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffd700;
            border-radius: 50%;
            animation: particleRise 1.2s ease-out infinite;
        }
        .chest-particle:nth-of-type(1) {
            left: 4px;
            bottom: 8px;
        }
        .chest-particle:nth-of-type(2) {
            left: 18px;
            bottom: 12px;
            animation-delay: 0.4s;
            background: #47a0ff;
        }
        .chest-particle:nth-of-type(3) {
            left: 30px;
            bottom: 6px;
            animation-delay: 0.8s;
            background: #a335ee;
        }
        @keyframes particleRise {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-32px) scale(0.3); }
        }

        @keyframes chestGlow {
            from { filter: brightness(1); }
            to   { filter: brightness(1.3); }
        }
        @keyframes lidOpen {
            0%, 70% { transform: rotateX(0deg); }
            100% { transform: rotateX(-45deg); }
        }

        @keyframes floatAnim {
            from { transform: translateY(0px); }
            to   { transform: translateY(-12px); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* ============================================================
           真·像素精灵帧动画（源自 GitHub Star-Office-UI 原生素材）
           精灵图: 128×64, 32×32/帧, 4列×2行 = 8帧
           CSS 显示: 48×48 (1.5x 放大)
           ============================================================ */
        .guest-1 { background-image: url('/static/guest_anim_1.webp'); }
        .guest-2 { background-image: url('/static/guest_anim_2.webp'); }
        .guest-3 { background-image: url('/static/guest_anim_3.webp'); }
        .guest-4 { background-image: url('/static/guest_anim_4.webp'); }
        .guest-5 { background-image: url('/static/guest_anim_5.webp'); }
        .guest-6 { background-image: url('/static/guest_anim_6.webp'); }

        .sprite-idle-1 { animation: spriteIdle1 1.6s steps(1) infinite; }
        .sprite-idle-2 { animation: spriteIdle2 1.6s steps(1) infinite; }
        .sprite-walk-3 { animation: spriteWalk3 1.2s steps(1) infinite; }

        @keyframes spriteIdle1 {
            0%,12.49% { background-position: 0 0; }
            12.5%,24.99% { background-position: -48px 0; }
            25%,37.49% { background-position: -96px 0; }
            37.5%,49.99% { background-position: -144px 0; }
            50%,62.49% { background-position: 0 -48px; }
            62.5%,74.99% { background-position: -48px -48px; }
            75%,87.49% { background-position: -96px -48px; }
            87.5%,100% { background-position: -144px -48px; }
        }
        @keyframes spriteIdle2 {
            0%,12.49% { background-position: 0 0; }
            12.5%,24.99% { background-position: -48px 0; }
            25%,37.49% { background-position: -96px 0; }
            37.5%,49.99% { background-position: -144px 0; }
            50%,62.49% { background-position: 0 -48px; }
            62.5%,74.99% { background-position: -48px -48px; }
            75%,87.49% { background-position: -96px -48px; }
            87.5%,100% { background-position: -144px -48px; }
        }
        @keyframes spriteWalk3 {
            0%,12.49% { background-position: 0 0; }
            12.5%,24.99% { background-position: -48px 0; }
            25%,37.49% { background-position: -96px 0; }
            37.5%,49.99% { background-position: -144px 0; }
            50%,62.49% { background-position: 0 -48px; }
            62.5%,74.99% { background-position: -48px -48px; }
            75%,87.49% { background-position: -96px -48px; }
            87.5%,100% { background-position: -144px -48px; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="panel-title">样板图场景切换</div>
        <button class="template-btn active" onclick="switchTemplate(1)">样板 1：宗门修炼大殿</button>
        <button class="template-btn" onclick="switchTemplate(2)">样板 2：万火九炼丹房</button>
        <button class="template-btn" onclick="switchTemplate(3)">样板 3：断崖演武飞升场</button>
        <button class="template-btn" onclick="switchTemplate(4)">样板 4：天工多宝藏宝阁</button>
        <button class="template-btn" onclick="switchTemplate(5)">样板 5：后山禁地聚灵阵</button>
    </div>

    <div class="canvas-container">
        <div class="game-canvas">

            <div class="top-ui-scroll">
                <span style="color:#8c2d19; font-size:14px; margin-right:20px;">雲門阁内修卷</span>
                <span style="margin-right:15px;">聚灵指数: <span style="color:#2b558c;">99k</span></span>
                <span>仙晶储备: <span style="color:#b85c00;">12,500</span></span>
                <span style="margin-left:auto; color:#8c2d19;">宗门令: 2 / 11</span>
            </div>

            <!-- 样板1：宗门修炼大殿 -->
            <div id="scene-1" class="scene-layer active">
                <div style="position:absolute; left:200px; top:200px; width:64px; height:32px; background:#5c4033; border:2px solid #000;"></div>
                <div style="position:absolute; left:216px; top:240px; width:32px; height:16px; background:#cc9966; border-radius:50px;"></div>

                <div style="position:absolute; left:400px; top:200px; width:64px; height:32px; background:#5c4033; border:2px solid #000;"></div>
                <div style="position:absolute; left:416px; top:240px; width:32px; height:16px; background:#cc9966; border-radius:50px;"></div>

                <!-- 大师兄·陆青 — 用真实像素精灵 -->
                <div class="pixel-avatar" style="left: 208px; top: 175px;">
                    <div class="name-tag">大师兄·陆青</div>
                    <div class="sprite-image guest-1 sprite-idle-1"></div>
                    <div class="sprite-shadow"></div>
                    <div class="speech-bubble"><b>【传书】</b> 师妹，本次宗门大比的《天仙录》抄本你可备齐了？</div>
                </div>
            </div>

            <!-- 样板2：万火九炼丹房 -->
            <div id="scene-2" class="scene-layer">
                <div style="position:absolute; left:60px; top:100px; color:#ff4500; font-size:14px;">【内设·九龙地火阵】</div>
                <div class="pixel-cauldron" style="left: 120px; top: 180px;"></div>
                <div class="pixel-cauldron" style="left: 240px; top: 180px; background:#2b558c;"></div>
                <!-- 炼丹童子 — 用真实像素精灵 -->
                <div class="pixel-avatar" style="left: 128px; top: 215px;">
                    <div class="name-tag" style="background:#a335ee; color:#fff;">炼丹童子</div>
                    <div class="sprite-image guest-2 sprite-idle-2"></div>
                    <div class="sprite-shadow"></div>
                </div>
            </div>

            <!-- 样板3：断崖演武飞升场 (张铁行走动画增强) -->
            <div id="scene-3" class="scene-layer">
                <div style="position:absolute; left:300px; top:250px; width:16px; height:48px; background:#8b5a2b; border:3px solid #000;"></div>
                <div style="position:absolute; left:290px; top:265px; width:36px; height:8px; background:#8b5a2b; border:2px solid #000;"></div>
                <!-- 执事·张铁 — 真实像素精灵 + 行走路径 -->
                <div class="pixel-avatar walking-zhangtie" style="left: 232px; top: 235px;">
                    <div class="name-tag" style="background:#d94f4f; color:#fff;">执事·张铁</div>
                    <div class="sprite-image guest-3 sprite-walk-3"></div>
                    <div class="sprite-shadow"></div>
                </div>
            </div>

            <!-- 样板4：天工多宝藏宝阁 -->
            <div id="scene-4" class="scene-layer">
                <div style="position:absolute; left:80px; top:120px; width:200px; height:160px; background:#4a2e1b; border:4px solid #000; box-shadow: inset 4px 4px 0 #6e4528;">
                    <div style="padding:10px; color:#ffd700; font-size:11px;">【天阶宝物架】</div>
                </div>
                <div class="floating-sword" style="left: 120px; top: 180px;"></div>
                <div class="floating-sword" style="left: 180px; top: 160px; background:#ffcc00; border-color:#b85c00;"></div>

                <div class="glowing-chest chest-common" style="left: 80px; top: 340px;">
                    <div class="chest-lid"></div>
                    <div class="chest-lock"></div>
                    <div class="chest-particle"></div>
                    <div class="chest-particle"></div>
                    <div class="chest-particle"></div>
                    <div style="position:absolute; top: 34px; left: 4px; color:#ffe359; font-size:9px;">凡品</div>
                </div>

                <div class="glowing-chest chest-rare" style="left: 140px; top: 340px;">
                    <div class="chest-lid"></div>
                    <div class="chest-lock"></div>
                    <div class="chest-particle"></div>
                    <div class="chest-particle"></div>
                    <div class="chest-particle"></div>
                    <div style="position:absolute; top: 34px; left: 4px; color:#47a0ff; font-size:9px;">稀有</div>
                </div>

                <div class="glowing-chest chest-epic" style="left: 200px; top: 336px;">
                    <div class="chest-lid"></div>
                    <div class="chest-lock"></div>
                    <div class="chest-particle"></div>
                    <div class="chest-particle"></div>
                    <div class="chest-particle"></div>
                    <div style="position:absolute; top: 34px; left: 4px; color:#a335ee; font-size:9px;">史诗</div>
                </div>
            </div>

            <!-- 样板5：后山禁地聚灵阵 -->
            <div id="scene-5" class="scene-layer">
                <div class="bagua-array" style="right: 80px; top: 120px;">
                    <div class="bagua-core"></div>
                </div>
                <!-- 小师妹·银月 — 用真实像素精灵 -->
                <div class="pixel-avatar" style="left: 650px; top: 195px;">
                    <div class="name-tag" style="background:#ff9ed2;">小师妹·银月</div>
                    <div class="sprite-image guest-4 sprite-idle-1"></div>
                    <div class="sprite-shadow"></div>
                </div>
            </div>

            <div class="stone-monolith">
                <b style="color:#ff6347;">宗门传闻纪事录 (Chronicles)</b>
                <div style="margin-top: 6px; line-height: 1.5;">
                    <div>【突破】内门弟子 <span style="color:#ffe359;">陆青</span> 成功将《紫阳真诀》提升至第七层！</div>
                    <div>【系统】当前场景精灵素材已加载，像素引擎运转顺畅。</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchTemplate(index) {
            const buttons = document.querySelectorAll('.template-btn');
            buttons.forEach((btn, idx) => {
                if (idx === (index - 1)) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const layers = document.querySelectorAll('.scene-layer');
            layers.forEach((layer, idx) => {
                if (idx === (index - 1)) layer.classList.add('active');
                else layer.classList.remove('active');
            });
        }
    </script>
</body>
</html>
