<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云门阁·Canvas修仙世界</title>
    <style>
        * {
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            font-family: 'Courier New', Courier, "Microsoft YaHei", monospace;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0c0806;
            color: #dcd1b4;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .control-panel {
            width: 260px;
            height: 100%;
            background-color: #17100b;
            border-right: 4px solid #281c13;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: inset -4px 0 0 #0d0906;
            z-index: 10;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #e5b842;
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 2px dashed #423021;
            padding-bottom: 12px;
            letter-spacing: 2px;
        }

        .template-btn {
            background-color: #231810;
            border: 3px solid #3d2a1c;
            color: #a49375;
            padding: 14px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            box-shadow: inset 2px 2px 0 #322216;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .template-btn:hover {
            background-color: #322216;
            color: #e5b842;
            border-color: #523926;
        }

        .template-btn.active {
            background-color: #802213;
            border-color: #d94b36;
            color: #ffffff;
            box-shadow: inset 3px 3px 0 #ab2f1a;
        }

        .template-btn::after {
            content: '▶';
            font-size: 10px;
            opacity: 0.5;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #070504;
            position: relative;
            padding: 20px;
        }

        .canvas-viewport {
            position: relative;
            border: 6px solid #23160e;
            box-shadow: 0 16px 32px rgba(0,0,0,0.8), inset 4px 4px 0 #3d2719;
            background-color: #1a130e;
        }

        canvas {
            display: block;
            background-color: #1a130e;
        }

        .scroll-ui-top {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 42px;
            background-color: #e6d7b8;
            border: 3px solid #2d251e;
            box-shadow: inset 2px 2px 0 #f5edd7, 0 4px 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: #2d251e;
            font-size: 13px;
            font-weight: bold;
        }

        .stone-ui-bottom {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 420px;
            height: 110px;
            background-color: #383d41;
            border: 4px solid #1d2022;
            box-shadow: inset 3px 3px 0 #545b60, 0 6px 12px rgba(0,0,0,0.6);
            padding: 12px;
            font-size: 12px;
            color: #c5cbd0;
            line-height: 1.6;
        }

        .chat-bubble {
            position: absolute;
            background: white;
            border: 3px solid #000;
            color: #000;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            width: 190px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            display: none;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="panel-title">宗门五界图卷</div>
        <button class="template-btn active" onclick="changeScene(1)">样板 1：宗门修炼大殿</button>
        <button class="template-btn" onclick="changeScene(2)">样板 2：万火九炼丹房</button>
        <button class="template-btn" onclick="changeScene(3)">样板 3：断崖演武飞升场</button>
        <button class="template-btn" onclick="changeScene(4)">样板 4：天工多宝藏宝阁</button>
        <button class="template-btn" onclick="changeScene(5)">样板 5：后山禁地聚灵阵</button>
    </div>

    <div class="main-container">
        <div class="canvas-viewport">
            <div class="scroll-ui-top">

                <span style="margin-right:20px;">聚灵指数: <span style="color:#2b6bb3;">99.4k</span></span>
                <span>仙晶储备: <span style="color:#b3742b;">12,500</span></span>
                <span style="margin-left:auto; color:#8a1f11;">宗门令: 2 / 11</span>
            </div>

            <div id="msg-bubble" class="chat-bubble" style="left: 280px; top: 160px;">
                <b>【传书】</b> 师妹，本次宗门大比的《天仙录》抄本你可备齐了？
            </div>

            <canvas id="xianxiaCanvas" width="960" height="640"></canvas>

            <div class="stone-ui-bottom">
                <b style="color:#e56952;">宗门传闻纪事 (Chronicles)</b>
                <div id="log-content" style="margin-top: 6px;">
                    <div>【突破】内门弟子 <span style="color:#ffe66f;">陆青</span> 成功将《紫阳真诀》提升至第七层！</div>
                    <div>【系统】Canvas像素级硬边引擎启动成功，Tileset网格无损对齐。</div>
                </div>
            </div>
        </div>
    </div>

                const color = colorMap[colorCode] || [0,0,0,0];
                const rIdx = i * 4;
                buffer.data[rIdx] = color[0];
                buffer.data[rIdx+1] = color[1];
                buffer.data[rIdx+2] = color[2];
                buffer.data[rIdx+3] = color[3];
            }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            tempCanvas.getContext('2d').putImageData(buffer, 0, 0);
            return tempCanvas;
        }

        const scrollColors = {

        // ====================================================================
        // 渲染函数
        // ====================================================================
        let currentTile = floorTile;

        function drawBackground() {
            const tileSize = 48;
            for (let x = 0; x < canvas.width; x += tileSize) {
                for (let y = 0; y < canvas.height; y += tileSize) {
                    ctx.drawImage(currentTile, x, y, tileSize, tileSize);
                }
            }
        }

        function drawTiledTexture(tex, startX, startY, width, height, tileW, tileH) {
            for (let x = startX; x < startX + width; x += tileW) {
                for (let y = startY; y < startY + height; y += tileH) {
                    ctx.drawImage(tex, x, y, tileW, tileH);
                }
            }
        }

        function drawCharacter(x, y, name, type, isPink) {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(x + 24, y + 84, 20, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            let img = maleSprite;
            if (isPink) {
                const pinkMatrix = maleSpriteMatrix.map(c => c === 'b' ? 'p' : (c === 'l' ? 'w' : (c === 'd' ? 'r' : c)));
                img = createPixelTexture(11, 12, pinkMatrix, spriteColors);
            }
            ctx.drawImage(img, x, y, 48, 88);

            ctx.fillStyle = isPink ? '#ffbde2' : '#ffe464';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.font = 'bold 12px "Microsoft YaHei"';

            const textWidth = ctx.measureText(name).width;
            ctx.fillRect(x + 24 - textWidth/2 - 6, y - 22, textWidth + 12, 20);
            ctx.strokeRect(x + 24 - textWidth/2 - 6, y - 22, textWidth + 12, 20);

            ctx.fillStyle = '#000000';
            ctx.fillText(name, x + 24 - textWidth/2, y - 8);
            ctx.restore();
        }

        function drawCauldron(x, y, label) {
            ctx.drawImage(cauldronAsset, x, y, 96, 96);
            ctx.fillStyle = 'rgba(255,69,0,' + (0.2 + Math.random()*0.3) + ')';
            ctx.beginPath();
            ctx.arc(x+48, y+96, 40, 0, Math.PI, false);
            ctx.fill();

            ctx.fillStyle = '#dcd1b4';
            ctx.font = '12px "Microsoft YaHei"';
            ctx.fillText(label, x + 12, y - 10);
        }

        function drawChest(x, y, asset, label, isOpen) {
            ctx.drawImage(asset, x, y, 96, 96);

            if (isOpen) {
                ctx.fillStyle = 'rgba(255,195,0,' + (0.06 + Math.random()*0.1) + ')';
                ctx.beginPath();
                ctx.arc(x + 48, y + 10, 60, 0, Math.PI * 2);
                ctx.fill();
            }

            if (label) {
                ctx.fillStyle = '#dcd1b4';
                ctx.font = '12px "Microsoft YaHei"';
                ctx.fillText(label, x, y - 10);
            }
        }

        // ====================================================================
        // 5大场景渲染
        // ====================================================================
        function renderLoop() {
            currentTile = (currentScene === 4 || currentScene === 5) ? grassTile : floorTile;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            const msgBubble = document.getElementById('msg-bubble');

            if (currentScene === 1) {
                msgBubble.style.display = 'block';

                ctx.fillStyle = '#422817';
                ctx.strokeStyle = '#1a0f08';
                ctx.lineWidth = 4;
                ctx.fillRect(200, 260, 96, 40);
                ctx.strokeRect(200, 260, 96, 40);

                drawCharacter(224, 170, "大师兄·陆青");
                drawCharacter(500, 220, "传功长老");

            } else if (currentScene === 2) {
                msgBubble.style.display = 'none';
                drawCauldron(160, 200, "乾坤九龙炉 (地火)");
                drawCauldron(400, 200, "寒漓淬灵鼎 (冰火)");
                drawCharacter(300, 240, "炼丹执事", 'male', true);

            } else if (currentScene === 3) {
                msgBubble.style.display = 'none';

                ctx.strokeStyle = '#5a6266';
                ctx.lineWidth = 6;
                ctx.strokeRect(100, 150, 760, 400);

                drawCharacter(200, 260, "执事·张铁");
                drawCharacter(600, 260, "试炼弟子");

            } else if (currentScene === 4) {
                msgBubble.style.display = 'none';

                // ── 全点阵资产：天工多宝藏宝阁 ──

                // 后墙木壁（点阵纹理平铺）
                drawTiledTexture(wallTile, 70, 44, 820, 200, 48, 48);

                // 金匾额 ×2倍
                ctx.drawImage(plaqueAsset, 240, 56, 192, 40);

                // 两侧竹简挂轴（点阵资产）
                ctx.drawImage(scrollAsset, 78, 70, 48, 136);
                ctx.drawImage(scrollAsset, 834, 70, 48, 136);

                // 矮台（点阵资产）
                ctx.drawImage(pedestalAsset, 120, 396, 240, 40);
                ctx.drawImage(pedestalAsset, 600, 396, 240, 40);

                // 双宝箱（12×12矩阵，96×96渲染）
                drawChest(182, 290, chest1Asset, "金丝蟠龙宝箱（开启中）", true);
                drawChest(668, 290, chest2Asset, "玄铁重宝箱（禁制锁闭）", false);

                // 守阁人居中
                drawCharacter(448, 380, "守阁·玄铁真人");

            } else if (currentScene === 5) {
                msgBubble.style.display = 'none';

                ctx.save();
                ctx.translate(480, 320);
                ctx.strokeStyle = '#2b7851';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(0, 0, 120, 0, Math.PI*2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(0, 0, 110, Math.PI/2, Math.PI*1.5);
                ctx.fill();
                ctx.restore();

                drawCharacter(456, 260, "小师妹·银月", 'male', true);
            }
        }

        function changeScene(index) {
            currentScene = index;

            const btns = document.querySelectorAll('.template-btn');
            btns.forEach((btn, i) => {
                if (i === index - 1) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const logContent = document.getElementById('log-content');
            const titles = [
                `<div>【突破】内门弟子 <span style="color:#ffe66f;">陆青</span> 成功将《紫阳真诀》提升至第七层！</div><div>【系统】大殿香火充沛，全宗门修炼速度提升10%。</div>`,
                `<div>【顿悟】外门弟子 <span style="color:#ffe66f;">张铁</span> 在炼丹房观摩地火，触发流火顿悟！</div><div>【产出】今日极品筑基丹已入库 50 颗。</div>`,
                `<div>【切磋】演武场剑气纵横，张铁一式"断浪"击碎了木人桩！</div><div>【日常】弟子们正在进行高强度体魄淬炼。</div>`,
                `<div>【珍宝】金丝蟠龙宝箱金芒大盛！玄铁重箱禁制锁固不可破。</div><div>【镇守】玄铁真人坐镇天工阁，两侧秘卷挂轴微微颤动。</div>`,
                `<div>【灵潮】后山阵法触发百年一遇的灵潮，核心灵气纯度大增！</div><div>【挂机】<span style="color:#ffbde2;">小师妹·银月</span> 正在此地深度闭关。</div>`
            ];
            logContent.innerHTML = titles[index - 1];

            renderLoop();
        }

        setInterval(renderLoop, 300);
    </script>
</body>
</html>
